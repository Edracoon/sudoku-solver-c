name: Build

on:
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.2"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
